controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    arm_cont:
      type: position_controllers/JointGroupPositionController
    
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 100.0

    base_frame_id: base_link

    left_wheel_names: ['front_left_joint', 'rear_left_joint']
    right_wheel_names: ['front_right_joint', 'rear_right_joint']
    wheel_separation: 0.7
    wheel_radius: 0.2

    use_stamped_vel: false

    wheels_per_side: 2

arm_cont:
  ros__parameters:
    joints:
      - arm_turret_joint
      - arm_base_turret_joint
      - arm_mid_joint
      - arm_end_effector_turn_joint
      - arm_end_effector_spin_joint
    interface_name: position
