controller_manager:
  ros__parameters:
    update_rate: 100
    use_sim_time: true

    diff_cont:
      type: diff_drive_controller/DiffDriveController

    arm_cont:
      type: joint_trajectory_controller/JointTrajectoryController
    
    joint_broad:
      type: joint_state_broadcaster/JointStateBroadcaster

diff_cont:
  ros__parameters:
    publish_rate: 100.0

    # Frame IDs
    base_frame_id: base_link
    odom_frame_id: odom
    enable_odom_tf: false

    left_wheel_names: ['front_left_joint', 'rear_left_joint']
    right_wheel_names: ['front_right_joint', 'rear_right_joint']
    wheel_separation: 0.8
    wheel_radius: 0.15025

    use_stamped_vel: false
    wheels_per_side: 2

    pose_covariance_diagonal: [0.001, 0.001, 1.0e-5, 1.0e-5, 1.0e-5, 0.01]
    twist_covariance_diagonal: [0.001, 0.001, 1.0e-5, 1.0e-5, 1.0e-5, 0.01]

arm_cont:
  ros__parameters:
    joints:
      - arm_turret_joint
      - arm_base_turret_joint
      - arm_mid_joint
      - arm_end_effector_turn_joint
      - arm_end_effector_spin_joint
    command_interfaces:
      - position
    state_interfaces:
      - position
      - velocity